- name: Install K3s Control Plane
  hosts: k3s_server
  become: yes
  tasks:
    - name: Install K3s on Master
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Read Node Token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: master_token_encoded

    - name: Decode and Set Token Fact
      set_fact:
        k3s_token: "{{ master_token_encoded.content | b64decode | trim }}"

- name: Join Ubuntu Muscle to Cluster
  hosts: k3s_agent
  become: yes
  tasks:
    - name: Install K3s Agent and Join
      shell: >
        curl -sfL https://get.k3s.io | 
        K3S_URL=https://{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}:6443 
        K3S_TOKEN={{ hostvars[groups['k3s_server'][0]]['k3s_token'] }} sh -
      args:
        creates: /usr/local/bin/k3s-agent